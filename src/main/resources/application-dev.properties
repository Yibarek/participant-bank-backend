# ===================================================================
# Development Profile Configuration (dev)
# ===================================================================

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/acs_participant_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Keycloak Development Realm Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://192.168.20.49:9091/realms/acs_apis
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://192.168.20.49:9091/realms/acs_apis/protocol/openid-connect/certs

# Application Logging Level
logging.level.org.multimedia=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
