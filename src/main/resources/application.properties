# Server Configuration
server.port=9081

# Active Profile (dev or prod)
spring.profiles.active=dev

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Timezone Setting (GMT+3 baseline)
spring.jpa.properties.hibernate.jdbc.time_zone=GMT+3

# Logging Configuration
logging.config=classpath:logback-spring.xml
logging.file.name=logs/participant-service.log

# Static Authentication Credentials
app.auth.static-username=admin
app.auth.static-password=Password@123

# Keycloak Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://192.168.20.49:9091/realms/acs_apis
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://192.168.20.49:9091/realms/acs_apis/protocol/openid-connect/certs
app.keycloak.client-id=acs_apis_client_api

# Participant Logo Storage Configuration
client.participant.logoPath=C:/etswitch/uploads/logos/

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
