spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

app.auth.static-username=admin
app.auth.static-password=Password@123
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9091/realms/acs
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9091/realms/acs/protocol/openid-connect/certs
app.keycloak.client-id=acs_apis_client_api
client.participant.logoPath=build/test-uploads/logos/
